<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    Source for og-image.jpg (the link-preview card). Render at 1200×630 in a browser
    served from the repo root, so portrait.jpg and the web fonts load.
    Everything that matters sits in the centre 630×630 square, because chat apps
    crop the card to a square thumbnail.
  -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&amp;family=JetBrains+Mono:wght@400;500&amp;display=block');
      .name { font-family: 'Fraunces', Georgia, serif; font-weight: 300; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
    <!-- Background gradient: slightly lighter in center -->
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#0c0b09"/>
    </radialGradient>
    <!-- Accent glow behind portrait -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2a261f" stroke-width="0.8"/>
    </pattern>
    <clipPath id="face">
      <circle cx="600" cy="212" r="150"/>
    </clipPath>
    <!-- One isometric layer of the blueprint -->
    <path id="plane" d="M0,-55 L110,0 L0,55 L-110,0 Z" fill="#191713" fill-opacity="0.8" stroke="#d4a574" stroke-width="1.2"/>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Blueprint stacks, left and right (outside the square crop) -->
  <g opacity="0.45">
    <use xlink:href="#plane" href="#plane" x="150" y="395"/>
    <use xlink:href="#plane" href="#plane" x="150" y="315"/>
    <use xlink:href="#plane" href="#plane" x="150" y="235"/>
    <use xlink:href="#plane" href="#plane" x="1050" y="395"/>
    <use xlink:href="#plane" href="#plane" x="1050" y="315"/>
    <use xlink:href="#plane" href="#plane" x="1050" y="235"/>
  </g>

  <!-- Portrait -->
  <circle cx="600" cy="212" r="260" fill="url(#glow)"/>
  <image xlink:href="portrait.jpg" href="portrait.jpg" x="398" y="57" width="400" height="500" clip-path="url(#face)" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="600" cy="212" r="150" fill="none" stroke="#0c0b09" stroke-width="2"/>
  <circle cx="600" cy="212" r="160" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.8"/>
  <circle cx="600" cy="212" r="174" fill="none" stroke="#d4a574" stroke-width="1" stroke-dasharray="2 7" opacity="0.4"/>

  <!-- Name -->
  <text class="name" x="600" y="462" text-anchor="middle" font-size="68" fill="#f1ede4" letter-spacing="-2">Saurabh Srivastava</text>

  <!-- Role -->
  <text class="mono" x="600" y="512" text-anchor="middle" font-size="19" font-weight="500" fill="#d4a574" letter-spacing="4">CHIEF ARCHITECT · SYSTEMS &amp; AI</text>

  <!-- Domain -->
  <text class="mono" x="600" y="574" text-anchor="middle" font-size="16" fill="#8a8376" letter-spacing="1.5">saurabh-oss.github.io</text>

  <!-- Border frame -->
  <rect x="2" y="2" width="1196" height="626" fill="none" stroke="#2a261f" stroke-width="4"/>
  <!-- Accent corner lines (top-left, bottom-right) -->
  <path d="M2,60 V2 H60" fill="none" stroke="#d4a574" stroke-width="2" opacity="0.5"/>
  <path d="M1198,570 V628 H1140" fill="none" stroke="#d4a574" stroke-width="2" opacity="0.5"/>
</svg>
