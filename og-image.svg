<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient: slightly lighter in center -->
    <radialGradient id="bg" cx="40%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#0c0b09"/>
    </radialGradient>
    <!-- Accent glow behind name -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2a261f" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>
  <!-- Glow blob behind text -->
  <ellipse cx="480" cy="315" rx="420" ry="260" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="80" y="160" width="4" height="310" rx="2" fill="#d4a574" opacity="0.9"/>

  <!-- Top label: small mono tag -->
  <text x="104" y="192" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="18" fill="#d4a574" opacity="0.8" letter-spacing="2">PORTFOLIO</text>

  <!-- Main name -->
  <text x="100" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#f1ede4" letter-spacing="-2">Saurabh Srivastava</text>

  <!-- Accent underline beneath name -->
  <rect x="100" y="326" width="560" height="3" rx="1.5" fill="#d4a574" opacity="0.6"/>

  <!-- Tagline -->
  <text x="102" y="388" font-family="'DM Sans', system-ui, sans-serif" font-size="28" font-weight="400" fill="#a8a092" letter-spacing="0.5">Architect of Systems &amp; AI</text>

  <!-- Pills row -->
  <!-- Pill 1 -->
  <rect x="100" y="415" width="130" height="34" rx="17" fill="#1a1814" stroke="#2a261f" stroke-width="1.5"/>
  <text x="165" y="437" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#d4a574" letter-spacing="0.5">16 yrs exp</text>
  <!-- Pill 2 -->
  <rect x="246" y="415" width="118" height="34" rx="17" fill="#1a1814" stroke="#2a261f" stroke-width="1.5"/>
  <text x="305" y="437" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#d4a574" letter-spacing="0.5">Open Source</text>
  <!-- Pill 3 -->
  <rect x="380" y="415" width="76" height="34" rx="17" fill="#1a1814" stroke="#2a261f" stroke-width="1.5"/>
  <text x="418" y="437" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#d4a574" letter-spacing="0.5">AI / ML</text>

  <!-- CTA button -->
  <rect x="100" y="468" width="200" height="46" rx="23" fill="#d4a574" opacity="0.12" stroke="#d4a574" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="200" y="497" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="18" font-weight="500" fill="#d4a574" letter-spacing="0.5">Explore Portfolio →</text>

  <!-- Domain bottom-right -->
  <text x="1120" y="570" text-anchor="end" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="18" fill="#6f695e" letter-spacing="1">saurabh-oss.github.io</text>

  <!-- Decorative right side: large faint "SS" monogram -->
  <text x="860" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="320" font-weight="700" fill="#d4a574" opacity="0.04" letter-spacing="-20">SS</text>

  <!-- Border frame -->
  <rect x="2" y="2" width="1196" height="626" rx="0" fill="none" stroke="#2a261f" stroke-width="4"/>
  <!-- Inner accent corner lines (top-left) -->
  <line x1="2" y1="2" x2="60" y2="2" stroke="#d4a574" stroke-width="2" opacity="0.5"/>
  <line x1="2" y1="2" x2="2" y2="60" stroke="#d4a574" stroke-width="2" opacity="0.5"/>
  <!-- Inner accent corner lines (bottom-right) -->
  <line x1="1198" y1="628" x2="1140" y2="628" stroke="#d4a574" stroke-width="2" opacity="0.5"/>
  <line x1="1198" y1="628" x2="1198" y2="570" stroke="#d4a574" stroke-width="2" opacity="0.5"/>
</svg>
