<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Saurabh Srivastava</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0c0b09; --text:#f1ede4; --muted:#a8a092; --accent:#d4a574; --line:#2a261f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'JetBrains Mono',monospace;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:2rem;text-align:center;
  }
  .code{
    font-family:'Fraunces',serif;font-weight:300;
    font-size:clamp(6rem,20vw,16rem);line-height:1;
    color:var(--accent);letter-spacing:-0.05em;
  }
  .code span{font-style:italic;color:var(--text);}
  h1{font-family:'Fraunces',serif;font-weight:300;font-style:italic;
    font-size:clamp(1.5rem,3vw,2.25rem);margin:1rem 0 0.5rem;color:var(--text);}
  p{color:var(--muted);font-size:0.9rem;letter-spacing:0.05em;margin-bottom:2rem;}
  a{
    display:inline-flex;align-items:center;gap:0.75rem;
    font-size:0.78rem;letter-spacing:0.15em;text-transform:uppercase;
    padding:1rem 1.75rem;border:1px solid var(--line);
    color:var(--text);text-decoration:none;transition:all 0.3s;
  }
  a:hover{background:var(--accent);color:var(--bg);border-color:var(--accent);}
</style>
</head>
<body>
  <div>
    <div class="code">4<span>0</span>4</div>
    <h1>Off the blueprint.</h1>
    <p>This page isn't part of the architecture.</p>
    <a href="/">← Back to home</a>
  </div>
</body>
</html>
